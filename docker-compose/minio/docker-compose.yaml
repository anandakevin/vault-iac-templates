volumes:
  minio-data:

services:
  minio:
    hostname: minio
    image: minio/minio:latest
    volumes:
      - minio-data:/minio-data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: 'admin'
      MINIO_ROOT_PASSWORD: 'password'
      MINIO_ADDRESS: ':9000'
      MINIO_CONSOLE_ADDRESS: ':9001'
    command: minio server /minio-data
